<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <h2 style="margin-bottom: 0.5rem;">{{ t('email.reset.title') }}</h2>
    <p>{{ t('email.greeting', name=display_name) }}</p>
    <p>{{ t('email.reset.intro') }}</p>
    <p>
      {{ t('email.reset.instruction') }}
    </p>
    <p>
      <a href="{{ reset_url }}" style="color: #2563eb;">{{ t('email.action.resetPassword') }}</a>
    </p>
    <p>{{ t('email.reset.expiry', minutes=expires_minutes) }}</p>
    <p>{{ t('email.reset.ignore') }}</p>
  </body>
</html>
