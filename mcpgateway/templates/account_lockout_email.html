<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
    <h2 style="margin-bottom: 0.5rem;">{{ t('email.lockout.title') }}</h2>
    <p>{{ t('email.greeting', name=display_name) }}</p>
    <p>
      {{ t('email.lockout.body') }}
    </p>
    <p><strong>{{ t('email.lockout.unlockTime') }}</strong> {{ locked_until }}</p>
    <p>
      {{ t('email.lockout.advice') }}
      <a href="{{ reset_url }}" style="color: #2563eb;">{{ t('email.action.resetPassword') }}</a>
    </p>
  </body>
</html>
